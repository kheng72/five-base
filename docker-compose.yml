services:
  nginx:
    image: nginx:latest
    container_name: fb_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - flask

  mysql:
    image: mysql:8.0
    container_name: fb_mysql
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase

  postgres:
    image: postgres:15
    container_name: fb_postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mydatabase

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fb_pgadmin
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres

  flask:
    build: ./flask
    container_name: fb_flask
    ports:
      - "5000:5000"
    volumes:
      - ./flask:/app
    depends_on:
      - mysql
      - postgres

volumes:
  mysql_data:
  postgres_data: